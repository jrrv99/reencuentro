services:
  db:
    image: pgvector/pgvector:pg16
    container_name: reencuentro_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: reencuentro_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: reencuentro_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro de Docker los servicios se resuelven por nombre y puerto interno,
      # independiente de los puertos del host en .env.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      # Monta el código fuente para hot-reload en desarrollo.
      - ../apps/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Para correr solo infra (sin api): docker compose up -d db redis

  # worker:
  #   build:
  #     context: ../apps/api
  #     dockerfile: Dockerfile
  #   env_file: [.env]
  #   environment:
  #     POSTGRES_HOST: db
  #     REDIS_URL: redis://redis:6379/0
